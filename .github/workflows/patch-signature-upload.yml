name: Patch firma operatore

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-signature-upload.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aggiorna firma operatore e conferma nuova scheda
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          old_css = '''.signature-pad{
  width:100%;
  height:95px;
  border:1px solid #bbb;
  border-radius:6px;
  background:#fff;
  touch-action:none;
  cursor:crosshair;
  display:block;
}'''
          new_css = '''.signature-preview{
  width:100%;
  height:95px;
  border:1px solid #bbb;
  border-radius:6px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  padding:4px;
}
.signature-image{
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
  object-fit:contain;
  display:none;
}
.signature-empty{
  font-size:12px;
  color:#888;
  text-align:center;
}'''
          assert old_css in s, 'Blocco CSS firma non trovato'
          s = s.replace(old_css, new_css, 1)

          old_print = '''  .signature-pad{
    width:100%!important;
    height:15mm!important;
    border:0.2mm solid #aaa!important;
    border-radius:0!important;
    background:#fff!important;
  }'''
          new_print = '''  .signature-preview{
    width:100%!important;
    height:15mm!important;
    border:0.2mm solid #aaa!important;
    border-radius:0!important;
    background:#fff!important;
    padding:0!important;
  }
  .signature-image{
    max-width:100%!important;
    max-height:100%!important;
    width:auto!important;
    height:auto!important;
    object-fit:contain!important;
  }
  .signature-empty{
    display:none!important;
  }'''
          assert old_print in s, 'Blocco stampa firma non trovato'
          s = s.replace(old_print, new_print, 1)

          old_html = '''            <label>Firma Operatore</label>
            <div class="signature-wrap">
              <canvas class="signature-pad" data-signature="phase_sign_${i}" aria-label="Firma operatore"></canvas>
              <div class="signature-actions">
                <button type="button" onclick="clearSignature('phase_sign_${i}')">Cancella firma</button>
                <span class="signature-placeholder">Firma con dito, penna touch o mouse</span>
              </div>
            </div>'''
          new_html = '''            <label>Firma Operatore</label>
            <div class="signature-wrap">
              <div class="signature-preview">
                <img class="signature-image" data-signature="phase_sign_${i}" alt="Firma operatore">
                <span class="signature-empty" data-signature-placeholder="phase_sign_${i}">Nessuna firma allegata</span>
              </div>
              <input type="file" data-signature-input="phase_sign_${i}" accept="image/png,image/jpeg,image/webp" hidden onchange="loadSignatureFile('phase_sign_${i}', this)">
              <div class="signature-actions">
                <button type="button" onclick="chooseSignature('phase_sign_${i}')">Allega / cambia firma</button>
                <button type="button" onclick="clearSignature('phase_sign_${i}')">Rimuovi firma</button>
                <span class="signature-placeholder">PNG, JPG o WEBP</span>
              </div>
            </div>'''
          assert old_html in s, 'Blocco HTML firma non trovato'
          s = s.replace(old_html, new_html, 1)

          s = s.replace('''  initSignaturePads();\n  restoreDraft();''', '''  restoreDraft();''', 1)

          old_collect = '''  document.querySelectorAll('canvas[data-signature]').forEach(canvas => {
    data.signatures[canvas.dataset.signature] = canvas.dataset.hasInk === '1'
      ? canvas.toDataURL('image/png')
      : '';
  });'''
          new_collect = '''  document.querySelectorAll('img[data-signature]').forEach(img => {
    data.signatures[img.dataset.signature] = img.dataset.hasSignature === '1'
      ? img.src
      : '';
  });'''
          assert old_collect in s, 'Blocco collect firma non trovato'
          s = s.replace(old_collect, new_collect, 1)

          old_apply = '''  document.querySelectorAll('canvas[data-signature]').forEach(canvas => {
    const saved = data.signatures && data.signatures[canvas.dataset.signature];
    if (saved) {
      drawSavedSignature(canvas, saved);
    }
  });'''
          new_apply = '''  document.querySelectorAll('img[data-signature]').forEach(img => {
    const saved = data.signatures && data.signatures[img.dataset.signature];
    setSignatureImage(img.dataset.signature, saved || '');
  });'''
          assert old_apply in s, 'Blocco apply firma non trovato'
          s = s.replace(old_apply, new_apply, 1)

          start = s.index('function setupCanvasSize(canvas) {')
          end = s.index('\n\nfunction saveDraft(show=true) {', start)
          new_js = r'''function setSignatureImage(key, dataUrl) {
  const img = document.querySelector(`img[data-signature="${key}"]`);
  const empty = document.querySelector(`[data-signature-placeholder="${key}"]`);
  if (!img) return;

  if (dataUrl) {
    img.src = dataUrl;
    img.dataset.hasSignature = '1';
    img.style.display = 'block';
    if (empty) empty.style.display = 'none';
  } else {
    img.removeAttribute('src');
    img.dataset.hasSignature = '0';
    img.style.display = 'none';
    if (empty) empty.style.display = '';
  }
}

function chooseSignature(key) {
  const input = document.querySelector(`input[data-signature-input="${key}"]`);
  if (!input) return;
  input.value = '';
  input.click();
}

function normalizeSignatureImage(dataUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const maxW = 900;
      const maxH = 300;
      const scale = Math.min(1, maxW / img.naturalWidth, maxH / img.naturalHeight);
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
      canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

function loadSignatureFile(key, input) {
  const file = input.files && input.files[0];
  if (!file) return;

  const allowed = ['image/png', 'image/jpeg', 'image/webp'];
  if (!allowed.includes(file.type)) {
    alert('Seleziona una firma in formato PNG, JPG o WEBP.');
    input.value = '';
    return;
  }

  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const dataUrl = await normalizeSignatureImage(reader.result);
      setSignatureImage(key, dataUrl);
      autoSave();
      statusEl.textContent = 'Firma allegata';
      setTimeout(() => statusEl.textContent = '', 1800);
    } catch (e) {
      alert('Non è stato possibile leggere il file della firma.');
    }
  };
  reader.onerror = () => alert('Non è stato possibile leggere il file della firma.');
  reader.readAsDataURL(file);
}

function clearSignature(key) {
  setSignatureImage(key, '');
  const input = document.querySelector(`input[data-signature-input="${key}"]`);
  if (input) input.value = '';
  autoSave();
}'''
          s = s[:start] + new_js + s[end:]

          old_reset = "if (!confirm('Vuoi cancellare tutti i dati di questa scheda e iniziarne una nuova?')) return;"
          new_reset = "if (!confirm('Creare una nuova scheda? Tutti i dati attualmente compilati verranno azzerati. Assicurati di aver salvato la bozza prima di continuare.')) return;"
          assert old_reset in s, 'Conferma Nuova scheda non trovata'
          s = s.replace(old_reset, new_reset, 1)

          path.write_text(s, encoding='utf-8')
          PY

      - name: Verifica modifica
        shell: bash
        run: |
          grep -q "Allega / cambia firma" index.html
          grep -q "Nessuna firma allegata" index.html
          grep -q "Creare una nuova scheda?" index.html
          ! grep -q "Firma con dito, penna touch o mouse" index.html
          ! grep -q "initSignaturePads" index.html

      - name: Pubblica modifica
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Firma operatore tramite caricamento immagine"
          git push origin main
