<style>
:root {
  --gold:#c99a3b;
  --gold2:#ead9b7;
  --black:#111;
  --beige:#f7f2e9;
  --line:#cfc8bc;
  --ok:#eaf7ee;
  --bad:#fdeeee;
}
*{box-sizing:border-box}
body{margin:0;background:#eee;font-family:Arial,Helvetica,sans-serif;color:#111}
.app{max-width:1180px;margin:0 auto;background:white;min-height:100vh;box-shadow:0 0 30px #0001}
.topbar{position:sticky;top:0;z-index:10;background:#111;color:#fff;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.topbar select,.topbar button{font-size:15px;padding:9px 12px;border-radius:8px;border:1px solid #555}
.topbar button{cursor:pointer;background:#fff}
.topbar .primary{background:var(--gold);border-color:var(--gold);font-weight:700}
.sheet{padding:18px}
.header-grid{display:grid;grid-template-columns:150px 1fr 190px;border:1.5px solid #111}
.header-grid>div{padding:12px;border-right:1px solid #111;display:flex;align-items:center;justify-content:center}
.header-grid>div:last-child{border-right:0}
.logo{max-width:142px;max-height:62px;width:auto;height:auto;object-fit:contain}
.title{font-size:24px;font-weight:800;text-align:center}
.rev{font-size:14px;line-height:1.35;text-align:center}
.meta{display:grid;grid-template-columns:150px 1fr 190px 190px;border-left:1.5px solid #111;border-right:1.5px solid #111;border-bottom:1.5px solid #111}
.meta .cell{padding:8px;border-right:1px solid #111}
.meta .cell:last-child{border-right:0}
label{font-weight:700}
input[type=text],input[type=date]{width:100%;padding:9px;border:1px solid #bbb;border-radius:6px;background:#fff;font-size:15px}
table{width:100%;border-collapse:collapse;margin-top:18px}
th,td{border:1px solid #222;vertical-align:top;padding:9px}
th{background:#f1eee8;text-align:left}
th:nth-child(1){width:16%}
th:nth-child(2){width:51%}
th:nth-child(3){width:13%}
th:nth-child(4){width:20%}
.phase{font-weight:800}
.resultbox{display:grid;gap:8px}
.inlinechecks{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.choice{display:flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid #bbb;border-radius:7px;cursor:pointer;user-select:none}
.choice input{width:18px;height:18px}
.hint{font-size:12px;color:#666}
.extra{margin-top:18px;border:1px solid #222}
.extra-row{display:grid;grid-template-columns:280px 1fr;border-bottom:1px solid #222}
.extra-row:last-child{border-bottom:0}
.extra-row>div{padding:9px}
.extra-row .lbl{font-weight:700;border-right:1px solid #222;background:#faf8f4}
.notice{margin:14px 0;padding:10px 12px;background:var(--beige);border-left:4px solid var(--gold);font-size:14px}
.footer-actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 8px}
.footer-actions button{padding:10px 14px;border-radius:8px;border:1px solid #aaa;background:white;cursor:pointer}
.status{font-size:13px;color:#555;margin-left:auto}

.signature-wrap{
  display:grid;
  gap:6px;
}
.signature-pad{
  width:100%;
  height:95px;
  border:1px solid #bbb;
  border-radius:6px;
  background:#fff;
  touch-action:none;
  cursor:crosshair;
  display:block;
}
.signature-actions{
  display:flex;
  gap:6px;
  align-items:center;
  flex-wrap:wrap;
}
.signature-actions button{
  padding:6px 9px;
  border:1px solid #bbb;
  border-radius:6px;
  background:#fff;
  cursor:pointer;
  font-size:12px;
}
.signature-placeholder{
  font-size:12px;
  color:#666;
}

@media(max-width:850px){
  .header-grid{grid-template-columns:100px 1fr}
  .header-grid .rev{grid-column:1/-1;border-top:1px solid #111}
  .meta{grid-template-columns:1fr 1fr}
  .meta .cell{border-top:1px solid #111}
  table,thead,tbody,tr,th,td{display:block}
  thead{display:none}
  tr{border:1px solid #222;margin-bottom:12px}
  td{border:0;border-bottom:1px solid #ddd}
  td:last-child{border-bottom:0}
  td:before{font-weight:700;display:block;margin-bottom:4px;color:#555}
  td:nth-child(1):before{content:"FASE"}
  td:nth-child(2):before{content:"PUNTO DI COLLAUDO"}
  td:nth-child(3):before{content:"TOLLERANZA / STRUMENTO"}
  td:nth-child(4):before{content:"ESITO"}
  .extra-row{grid-template-columns:1fr}
  .extra-row .lbl{border-right:0;border-bottom:1px solid #ddd}
}
@media print{
  *{
    -webkit-print-color-adjust:exact !important;
    print-color-adjust:exact !important;
  }
  html,body{
    margin:0!important;
    padding:0!important;
    background:#fff!important;
  }
  body{
    font-family:"Times New Roman", Times, serif!important;
    color:#111!important;
  }
  .app{
    max-width:none!important;
    width:100%!important;
    min-height:auto!important;
    box-shadow:none!important;
    background:#fff!important;
  }
  .topbar,.notice,.footer-actions,.hint,.signature-actions{
    display:none!important;
  }
  .sheet{
    padding:0!important;
    width:100%!important;
  }

  .header-grid{
    display:grid!important;
    grid-template-columns:28mm 1fr 36mm!important;
    border:0.35mm solid #111!important;
    break-inside:avoid;
  }
  .header-grid>div{
    min-height:16mm!important;
    padding:2mm!important;
    border-right:0.25mm solid #111!important;
    display:flex!important;
    align-items:center!important;
    justify-content:center!important;
  }
  .header-grid>div:last-child{border-right:0!important}
  .header-grid .rev{
    grid-column:auto!important;
    border-top:0!important;
    font-size:8pt!important;
    line-height:1.2!important;
  }
  .logo{
    max-width:26mm!important;
    max-height:12mm!important;
    width:auto!important;
    height:auto!important;
    object-fit:contain!important;
  }
  .title{
    font-size:13pt!important;
    font-weight:700!important;
    line-height:1.1!important;
    text-align:center!important;
  }

  .meta{
    display:grid!important;
    grid-template-columns:28mm 1fr 36mm 36mm!important;
    border-left:0.35mm solid #111!important;
    border-right:0.35mm solid #111!important;
    border-bottom:0.35mm solid #111!important;
    break-inside:avoid;
  }
  .meta .cell{
    min-height:12mm!important;
    padding:1.5mm!important;
    border-right:0.25mm solid #111!important;
    border-top:0!important;
    font-size:8.5pt!important;
  }
  .meta .cell:last-child{border-right:0!important}
  .meta label{font-size:8.5pt!important}
  .meta input[type=text], .meta input[type=date]{
    font-family:"Times New Roman", Times, serif!important;
    font-size:8pt!important;
    padding:1mm!important;
    margin-top:1mm!important;
  }

  table{
    display:table!important;
    table-layout:fixed!important;
    width:100%!important;
    border-collapse:collapse!important;
    margin-top:2.5mm!important;
    font-size:7.3pt!important;
    line-height:1.12!important;
  }
  thead{display:table-header-group!important}
  tbody{display:table-row-group!important}
  tr{
    display:table-row!important;
    border:0!important;
    margin:0!important;
    break-inside:avoid!important;
    page-break-inside:avoid!important;
  }
  th,td{
    display:table-cell!important;
    border:0.25mm solid #222!important;
    vertical-align:top!important;
    padding:1.4mm!important;
    overflow-wrap:anywhere!important;
  }
  td:before{display:none!important}
  th{
    background:#fff!important;
    font-weight:700!important;
    text-align:left!important;
    font-size:7.5pt!important;
  }
  th:nth-child(1){width:17%!important}
  th:nth-child(2){width:48%!important}
  th:nth-child(3){width:13%!important}
  th:nth-child(4){width:22%!important}
  .phase{
    font-weight:700!important;
    font-size:7.4pt!important;
  }

  .resultbox{
    display:grid!important;
    gap:1mm!important;
  }
  .resultbox label{
    font-size:7.2pt!important;
  }
  input[type=text],input[type=date]{
    width:100%!important;
    padding:1mm!important;
    border:0.2mm solid #aaa!important;
    border-radius:0!important;
    background:#fff!important;
    font-family:"Times New Roman", Times, serif!important;
    font-size:7pt!important;
    color:#111!important;
  }
  .inlinechecks{
    display:flex!important;
    gap:1mm!important;
    align-items:center!important;
    flex-wrap:nowrap!important;
  }
  .choice{
    padding:0.7mm 1mm!important;
    border:0!important;
    border-radius:0!important;
    font-size:7pt!important;
  }
  .choice input{
    width:3.5mm!important;
    height:3.5mm!important;
    margin:0!important;
  }
  .signature-pad{
    width:100%!important;
    height:15mm!important;
    border:0.2mm solid #aaa!important;
    border-radius:0!important;
    background:#fff!important;
  }

  .extra{
    margin-top:3mm!important;
    border:0.25mm solid #222!important;
    break-inside:avoid!important;
  }
  .extra-row{
    display:grid!important;
    grid-template-columns:52mm 1fr!important;
    border-bottom:0.25mm solid #222!important;
  }
  .extra-row:last-child{border-bottom:0!important}
  .extra-row>div{
    padding:1.5mm!important;
    font-size:8pt!important;
  }
  .extra-row .lbl{
    border-right:0.25mm solid #222!important;
    border-bottom:0!important;
    background:#fff!important;
    font-weight:700!important;
  }

  @page{
    size:A4 portrait;
    margin:7mm;
  }
}
</style>
</head>

  </div>

const typeSel = document.getElementById('formType');
const statusEl = document.getElementById('status');

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[s]);
}

function storageKey() {
  return 'pw-collaudo-' + typeSel.value;
}

function render() {
  const f = FORMS[typeSel.value];
  const logo = LOGO ? `<img class="logo" src="${LOGO}" alt="Planet Windows">` : `<div style="font-weight:800">planetwindows</div>`;
  let rows = '';
  f.phases.forEach((p,i)=>{
    rows += `
      <tr>
        <td class="phase">${p[0]}</td>
        <td>${p[1]}</td>
        <td>${p[2] || ''}</td>
        <td>
          <div class="resultbox">
            <label>Data</label>
            <input type="date" data-field="phase_date_${i}">
            <label>Esito</label>
            <div class="inlinechecks">
              <label class="choice"><input type="checkbox" data-group="esito_${i}" data-value="C"> C</label>
              <label class="choice"><input type="checkbox" data-group="esito_${i}" data-value="NC"> NC</label>
            </div>
            <div class="hint">Facoltativo: può restare non selezionato.</div>
            <label>Firma Operatore</label>
            <div class="signature-wrap">
              <canvas class="signature-pad" data-signature="phase_sign_${i}" aria-label="Firma operatore"></canvas>
              <div class="signature-actions">
                <button type="button" onclick="clearSignature('phase_sign_${i}')">Cancella firma</button>
                <span class="signature-placeholder">Firma con dito, penna touch o mouse</span>
              </div>
            </div>
          </div>
        </td>
      </tr>`;
  });

  let extra = '';
  if (f.extra.length) {
    extra = `<div class="extra">` + f.extra.map((x,i)=>`
      <div class="extra-row">
        <div class="lbl">${x}</div>
        <div><input type="text" data-field="extra_${i}" placeholder="Compila qui"></div>
      </div>`).join('') + `</div>`;
  }

  document.getElementById('formArea').innerHTML = `
    <div class="header-grid">
      <div>${logo}</div>
      <div class="title">${f.title}</div>
      <div class="rev">Mod_SC: Scheda Collaudo<br>${f.rev}</div>
    </div>
    <div class="meta">
      <div class="cell"><label>COMMESSA</label></div>
      <div class="cell"><input type="text" data-field="commessa" placeholder="Numero commessa"></div>
      <div class="cell"><label>Data inizio lavorazione</label><input type="date" data-field="data_inizio"></div>
      <div class="cell"><label>Data Fine lavorazione</label><input type="date" data-field="data_fine"></div>
    </div>

    <table>
      <thead><tr><th>FASE</th><th>PUNTO DI COLLAUDO</th><th>TOLLERANZA<br>- STRUMENTO</th><th>ESITO</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    ${extra}
  `;

  // C/NC mutually exclusive but optional
  document.querySelectorAll('input[data-group]').forEach(ch => {
    ch.addEventListener('change', e => {
      if (e.target.checked) {
        document.querySelectorAll(`input[data-group="${e.target.dataset.group}"]`).forEach(other => {
          if (other !== e.target) other.checked = false;
        });
      }
      autoSave();
    });
  });
  document.querySelectorAll('input[data-field]').forEach(inp => inp.addEventListener('input', autoSave));
  initSignaturePads();
  restoreDraft();
}

function collect() {
  const data = {
    type: typeSel.value,
    title: FORMS[typeSel.value].title,
    fields: {},
    esiti: {},
    signatures: {},
    saved_at: new Date().toISOString()
  };
  document.querySelectorAll('input[data-field]').forEach(el => data.fields[el.dataset.field] = el.value);
  document.querySelectorAll('input[data-group]').forEach(el => {
    if (el.checked) data.esiti[el.dataset.group] = el.dataset.value;
  });
  document.querySelectorAll('canvas[data-signature]').forEach(canvas => {
    data.signatures[canvas.dataset.signature] = canvas.dataset.hasInk === '1'
      ? canvas.toDataURL('image/png')
      : '';
  });
  return data;
}

function apply(data) {
  if (!data) return;
  document.querySelectorAll('input[data-field]').forEach(el => {
    if (data.fields && data.fields[el.dataset.field] !== undefined) el.value = data.fields[el.dataset.field];
  });
  document.querySelectorAll('input[data-group]').forEach(el => {
    el.checked = !!(data.esiti && data.esiti[el.dataset.group] === el.dataset.value);
  });
  document.querySelectorAll('canvas[data-signature]').forEach(canvas => {
    const saved = data.signatures && data.signatures[canvas.dataset.signature];
    if (saved) {
      drawSavedSignature(canvas, saved);
    }
  });
}


function setupCanvasSize(canvas) {
  const rect = canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const saved = canvas.dataset.hasInk === '1' ? canvas.toDataURL('image/png') : '';
  const dpr = Math.max(window.devicePixelRatio || 1, 1);
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#111';
  if (saved) drawSavedSignature(canvas, saved);
}

function pointOnCanvas(canvas, evt) {
  const r = canvas.getBoundingClientRect();
  return {
    x: evt.clientX - r.left,
    y: evt.clientY - r.top
  };
}

function initSignaturePads() {
  document.querySelectorAll('canvas[data-signature]').forEach(canvas => {
    canvas.dataset.hasInk = '0';
    setupCanvasSize(canvas);

    let drawing = false;
    let last = null;

    const start = (e) => {
      e.preventDefault();
      drawing = true;
      last = pointOnCanvas(canvas, e);
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    };

    const move = (e) => {
      if (!drawing) return;
      e.preventDefault();
      const p = pointOnCanvas(canvas, e);
      const ctx = canvas.getContext('2d');
      ctx.beginPath();
      ctx.moveTo(last.x, last.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      last = p;
      canvas.dataset.hasInk = '1';
    };

    const end = (e) => {
      if (!drawing) return;
      e.preventDefault();
      drawing = false;
      last = null;
      autoSave();
    };

    canvas.addEventListener('pointerdown', start);
    canvas.addEventListener('pointermove', move);
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', end);
    canvas.addEventListener('pointerleave', (e) => {
      if (drawing && e.buttons === 0) end(e);
    });
  });
}

function clearSignature(key) {
  const canvas = document.querySelector(`canvas[data-signature="${key}"]`);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  canvas.dataset.hasInk = '0';
  autoSave();
}

function drawSavedSignature(canvas, dataUrl) {
  const img = new Image();
  img.onload = () => {
    const rect = canvas.getBoundingClientRect();
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // draw in CSS-pixel coordinates because setupCanvasSize already applies DPR transform
    ctx.drawImage(img, 0, 0, rect.width, rect.height);
    canvas.dataset.hasInk = '1';
  };
  img.src = dataUrl;
}

window.addEventListener('resize', () => {
  document.querySelectorAll('canvas[data-signature]').forEach(setupCanvasSize);
});


function saveDraft(show=true) {
  localStorage.setItem(storageKey(), JSON.stringify(collect()));
  if (show) {
    statusEl.textContent = 'Bozza salvata';
    setTimeout(()=>statusEl.textContent='',1800);
  }
}
function autoSave() { saveDraft(false); }

function restoreDraft() {
  const raw = localStorage.getItem(storageKey());
  if (raw) {
    try { apply(JSON.parse(raw)); statusEl.textContent='Bozza ripristinata'; setTimeout(()=>statusEl.textContent='',1800); } catch(e) {}
  }
}

function resetCurrent() {
  if (!confirm('Vuoi cancellare tutti i dati di questa scheda e iniziarne una nuova?')) return;
  localStorage.removeItem(storageKey());
  render();
}

function exportJson() {
  const blob = new Blob([JSON.stringify(collect(), null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const commessa = document.querySelector('[data-field="commessa"]')?.value || 'senza_commessa';
  a.download = `${typeSel.value}_${commessa}_collaudo.json`.replace(/[^a-zA-Z0-9._-]+/g,'_');
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

typeSel.addEventListener('change', render);
render();
</script>
